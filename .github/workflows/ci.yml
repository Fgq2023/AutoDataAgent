name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: "Test (fully offline: deterministic mock planner, no API keys)"
        run: pytest -v
      - name: Check demo answers and recovery baseline
        run: python scripts/run_baseline.py
      - name: Check controlled repair benchmark (offline oracle)
        run: python scripts/run_repair_benchmark.py
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-python-${{ matrix.python-version }}
          path: |
            outputs/baseline_*/
            outputs/repair_benchmark_*/
